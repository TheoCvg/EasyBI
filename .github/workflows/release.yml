name: Release

# Publishes the NuGet packages when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# Uses nuget.org Trusted Publishing: no stored API key. Requires a nuget.org Trusted Publishing
# policy for this repository and workflow file (release.yml), and the NUGET_USER repository
# secret holding the nuget.org profile name (not the email address).
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub release
  id-token: write  # request the OIDC token exchanged for a temporary nuget.org API key

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build -p:Version=${{ env.VERSION }} --output artifacts

      # The temporary API key is valid for one hour: request it right before pushing
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
