# Site of a version published before the docs folder existed: its README as a single page (see workflows/docs.yml,
# which replaces {version}).
[project]
site_name = "EasyBI {version}"
site_url = "https://theocvg.github.io/EasyBI/"
repo_url = "https://github.com/TheoCvg/EasyBI"
repo_name = "TheoCvg/EasyBI"
nav = [{ "README" = "index.md" }]

[project.theme]
language = "en"
custom_dir = "../overrides"
features = ["content.code.copy", "navigation.top", "search.highlight", "toc.follow"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra.version]
provider = "mike"
default = "latest"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
