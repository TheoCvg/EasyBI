# Documentation site, built by Zensical (https://zensical.org) from the docs folder and published on GitHub Pages by
# .github/workflows/docs.yml: one version per release tag, and "dev" for the develop branch.

[project]
site_name = "EasyBI"
site_description = "A self-service BI library for WPF"
site_url = "https://theocvg.github.io/EasyBI/"
repo_url = "https://github.com/TheoCvg/EasyBI"
repo_name = "TheoCvg/EasyBI"
# The edit button of a page opens its Markdown file on the development branch
edit_uri = "edit/develop/docs/"
copyright = "EasyBI contributors"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "The designer" = "guide/designer.md" },
    { "Calculated measures" = "guide/calculated-measures.md" },
    { "Filtering and cross-filtering" = "guide/filtering.md" },
  ] },
  { "Visuals" = [
    { "Comparisons over time" = "visuals/time-comparisons.md" },
    { "Combined charts" = "visuals/combined-charts.md" },
    { "Matrix" = "visuals/matrix.md" },
    { "Conditional formatting" = "visuals/conditional-formatting.md" },
    { "Tooltips" = "visuals/tooltips.md" },
    { "Legends" = "visuals/legends.md" },
    { "Several axis fields" = "visuals/axis-fields.md" },
    { "Value labels" = "visuals/value-labels.md" },
  ] },
  { "Dashboard" = [
    { "Dashboard" = "dashboard/index.md" },
    { "Drag and drop" = "dashboard/drag-and-drop.md" },
  ] },
  { "Customization" = [
    { "Theming" = "customization/theming.md" },
    { "Slots" = "customization/slots.md" },
    { "Localization" = "customization/localization.md" },
    { "Writing a connector" = "customization/connectors.md" },
  ] },
  { "Reference" = [
    { "Report format" = "reference/report-format.md" },
    { "Known limitations" = "reference/limitations.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
# Templates overriding the theme's: the banner of an older version
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# The version selector, filled by mike (one version per release tag, "dev" for develop)
[project.extra.version]
provider = "mike"
default = "latest"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
